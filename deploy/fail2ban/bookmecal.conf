# fail2ban filter for Book Me Calendar: src/log/security.log (one JSON object per line).
# Copy to /etc/fail2ban/filter.d/bookmecal.conf and enable the jail in bookmecal.local.
#
# Matches events that only come from failed or abusive requests. Not matched on purpose:
# login_ok, csrf_failed (also an expired admin page) and pending_limit (a customer who
# books too often is not an attack).

[Definition]
failregex = ^\{"time":"[^"]+","event":"(?:login_failed|login_locked|honeypot|form_too_fast|form_token_invalid|rate_limited|cancel_token_invalid|feed_token_invalid)","ip":"<ADDR>"
ignoreregex =

# The "time" field is ISO 8601 with offset, e.g. 2026-10-22T07:32:57+02:00
datepattern = ^\{"time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z"
